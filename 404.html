<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada | CotaçãoSeguros</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1f10;--surface:#162a17;--ink:#fff;--muted:#b7bfb7;--accent:#c6f19d;--accent-ink:#0f1f10;--display:"Barlow Condensed","Arial Narrow",sans-serif;--text:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:1.0625rem;line-height:1.5;min-height:100svh;display:flex;flex-direction:column}
header{padding:20px 16px}
header a{font-family:var(--display);font-weight:800;letter-spacing:.02em;color:var(--ink);text-decoration:none;font-size:1.25rem}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 16px 64px;max-width:640px;margin:0 auto;width:100%}
.code{font-family:var(--display);font-weight:800;font-size:clamp(5rem,20vw,9rem);line-height:.9;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(2rem,7vw,3rem);line-height:1;margin:16px 0 12px}
p{color:var(--muted);max-width:46ch}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border-radius:999px;font-weight:600;text-decoration:none;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.25)}
</style>
</head>
<body>
<header><a href="/">COTAÇÃOSEGUROS</a></header>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>Essa página saiu da rota</h1>
  <p>O endereço não existe ou mudou. Mas sua cotação continua a um toque: manda o modelo e o ano da moto no WhatsApp e recebe o valor em poucos minutos.</p>
  <div class="actions">
    <a class="btn" data-wa="404" href="https://wa.me/5511957671467?text=Ol%C3%A1%2C%20quero%20cotar%20um%20seguro%20de%20moto">Cotar no WhatsApp</a>
    <a class="btn ghost" href="/">Voltar ao início</a>
  </div>
</main>
</body>
</html>
